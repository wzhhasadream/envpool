name: Build Wheels (GitHub Release)

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    container: trinkle23897/envpool-release:2023-01-02-5f1a5fd
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          ln -sf /root/.cache $HOME/.cache
          ln -sf /root/.pyenv $HOME/.pyenv
          pyenv global ${{ matrix.python-version }}-dev

      - name: Build wheel (manylinux)
        run: |
          make pypi-wheel
          ls -la wheelhouse/ || true
          pip3 install dist/*.whl --force-reinstall

      - name: Smoke test
        run: |
          python3 -c "import envpool; print(envpool.__version__); print(envpool.__file__)"
          python3 - <<'PY'
          import numpy as np
          import envpool
          env = envpool.make("CartPole-v1", env_type="gymnasium", num_envs=4)
          obs, info = env.reset()
          obs, rew, term, trunc, info = env.step(np.zeros(4, dtype=np.int32))
          print("ok", obs.shape, rew.shape)
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-py${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la dist

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
